syntax = "proto3";
package atendimento;
option java_package = "com.mycompany.atendimentorpc";
option java_multiple_files = true;
service AtendimentoService {
    rpc PegarSenha (PedidoSenha) returns (Senha);
    // v2: rpc novos entram depois dos que já existem
    rpc CancelarSenha (PedidoCancelamento) returns (ResultadoCancelamento);
    rpc ChamarProxima (Vazio) returns (Senha);
}
enum TipoAtendimento {
    NORMAL = 0;
    PRIORITARIO = 1;
}
message PedidoSenha {
    string nome = 1;
    TipoAtendimento tipo = 2;
    string local = 3;
}
message Senha {
    int32 numero = 1;
    string codigo = 2;
    string mensagem = 3;
    int32 tempoEstimado = 4; // v2: minutos de espera; número novo
    
}
// v2: mensagens novas
message Vazio {}
message PedidoCancelamento {
    string codigo = 1;
}
message ResultadoCancelamento {
    bool cancelada = 1;
    string mensagem = 2;
}
